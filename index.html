<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣事件地圖 — Ollama 版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root {
    --bg: #0a0e14;
    --bg2: #0f1520;
    --bg3: #151d2e;
    --border: #1e2d45;
    --accent: #00d4ff;
    --accent2: #00ff88;
    --text: #c8d8e8;
    --text-dim: #5a7a9a;
    --red: #ff4466;
    --orange: #ff8844;
    --yellow: #ffcc00;
    --green: #00ff88;
    --blue: #00aaff;
    --purple: #aa66ff;
    --cat-disaster: #ff4466;
    --cat-politics: #aa66ff;
    --cat-society: #00aaff;
    --cat-economy: #ffcc00;
    --cat-traffic: #ff8844;
    --cat-other: #5a7a9a;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 13px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Toolbar ── */
  #toolbar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    z-index: 1000;
    flex-shrink: 0;
  }

  #toolbar .logo {
    font-family: 'Share Tech Mono', monospace;
    font-size: 15px;
    color: var(--accent);
    letter-spacing: 2px;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #toolbar .logo::before {
    content: '';
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .toolbar-divider {
    width: 1px; height: 24px;
    background: var(--border);
    flex-shrink: 0;
  }

  select, #county-filter {
    background: var(--bg3);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 10px;
    border-radius: 4px;
    font-family: 'Noto Sans TC', sans-serif;
    font-size: 12px;
    cursor: pointer;
  }

  select:focus { outline: none; border-color: var(--accent); }

  .cat-filters {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .cat-tag {
    padding: 4px 10px;
    border-radius: 12px;
    border: 1px solid;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
    user-select: none;
  }

  .cat-tag.active { color: #000; }
  .cat-tag[data-cat="災害"] { border-color: var(--cat-disaster); color: var(--cat-disaster); }
  .cat-tag[data-cat="災害"].active { background: var(--cat-disaster); }
  .cat-tag[data-cat="政治"] { border-color: var(--cat-politics); color: var(--cat-politics); }
  .cat-tag[data-cat="政治"].active { background: var(--cat-politics); }
  .cat-tag[data-cat="社會"] { border-color: var(--cat-society); color: var(--cat-society); }
  .cat-tag[data-cat="社會"].active { background: var(--cat-society); }
  .cat-tag[data-cat="經濟"] { border-color: var(--cat-economy); color: var(--cat-economy); }
  .cat-tag[data-cat="經濟"].active { background: var(--cat-economy); color: #000; }
  .cat-tag[data-cat="交通"] { border-color: var(--cat-traffic); color: var(--cat-traffic); }
  .cat-tag[data-cat="交通"].active { background: var(--cat-traffic); color: #000; }
  .cat-tag[data-cat="其他"] { border-color: var(--cat-other); color: var(--cat-other); }
  .cat-tag[data-cat="其他"].active { background: var(--cat-other); }

  .toolbar-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #status-text {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    white-space: nowrap;
  }

  #status-text.loading { color: var(--yellow); }
  #status-text.error { color: var(--red); }
  #status-text.ok { color: var(--accent2); }

  #refresh-btn {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 5px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    letter-spacing: 1px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  #refresh-btn:hover { background: var(--accent); color: #000; }
  #refresh-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Main layout ── */
  #main {
    display: flex;
    flex: 1;
    overflow: hidden;
  }

  /* ── Map ── */
  #map {
    flex: 1;
    background: var(--bg);
  }

  .leaflet-container { background: #080c12 !important; }

  /* ── Sidebar ── */
  #sidebar {
    width: 280px;
    background: var(--bg2);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    flex-shrink: 0;
  }

  #sidebar-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }

  #stats {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
  }

  .stat-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 8px;
    text-align: center;
  }

  .stat-num {
    font-family: 'Share Tech Mono', monospace;
    font-size: 20px;
    color: var(--accent);
    display: block;
  }

  .stat-label {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 2px;
  }

  .stat-item.cat { border-left: 3px solid; }
  .stat-item.cat-災害 { border-left-color: var(--cat-disaster); }
  .stat-item.cat-災害 .stat-num { color: var(--cat-disaster); }
  .stat-item.cat-政治 { border-left-color: var(--cat-politics); }
  .stat-item.cat-政治 .stat-num { color: var(--cat-politics); }
  .stat-item.cat-社會 { border-left-color: var(--cat-society); }
  .stat-item.cat-社會 .stat-num { color: var(--cat-society); }
  .stat-item.cat-經濟 { border-left-color: var(--cat-economy); }
  .stat-item.cat-經濟 .stat-num { color: var(--cat-economy); }
  .stat-item.cat-交通 { border-left-color: var(--cat-traffic); }
  .stat-item.cat-交通 .stat-num { color: var(--cat-traffic); }
  .stat-item.cat-其他 { border-left-color: var(--cat-other); }
  .stat-item.cat-其他 .stat-num { color: var(--cat-other); }

  #news-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }

  #news-list::-webkit-scrollbar { width: 4px; }
  #news-list::-webkit-scrollbar-track { background: var(--bg2); }
  #news-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .news-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: border-color 0.2s;
    border-left: 3px solid transparent;
  }

  .news-item:hover { border-color: var(--accent); }
  .news-item.cat-災害 { border-left-color: var(--cat-disaster); }
  .news-item.cat-政治 { border-left-color: var(--cat-politics); }
  .news-item.cat-社會 { border-left-color: var(--cat-society); }
  .news-item.cat-經濟 { border-left-color: var(--cat-economy); }
  .news-item.cat-交通 { border-left-color: var(--cat-traffic); }
  .news-item.cat-其他 { border-left-color: var(--cat-other); }

  .news-title {
    font-size: 12px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 4px;
  }

  .news-meta {
    display: flex;
    gap: 6px;
    align-items: center;
  }

  .news-loc {
    font-size: 10px;
    color: var(--text-dim);
  }

  .news-cat-badge {
    font-size: 9px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 500;
  }

  .badge-災害 { background: rgba(255,68,102,0.2); color: var(--cat-disaster); }
  .badge-政治 { background: rgba(170,102,255,0.2); color: var(--cat-politics); }
  .badge-社會 { background: rgba(0,170,255,0.2); color: var(--cat-society); }
  .badge-經濟 { background: rgba(255,204,0,0.2); color: var(--cat-economy); }
  .badge-交通 { background: rgba(255,136,68,0.2); color: var(--cat-traffic); }
  .badge-其他 { background: rgba(90,122,154,0.2); color: var(--cat-other); }

  .news-summary {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 5px;
    line-height: 1.5;
    display: none;
  }

  .news-item.expanded .news-summary { display: block; }

  .news-link {
    display: inline-block;
    margin-top: 4px;
    font-size: 10px;
    color: var(--accent);
    text-decoration: none;
  }

  .news-link:hover { text-decoration: underline; }

  /* ── Loading overlay ── */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: rgba(10,14,20,0.85);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    gap: 16px;
    display: none;
  }

  #loading-overlay.show { display: flex; }

  .loading-spinner {
    width: 40px; height: 40px;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-msg {
    font-family: 'Share Tech Mono', monospace;
    font-size: 13px;
    color: var(--accent);
    letter-spacing: 2px;
  }

  #loading-progress {
    font-size: 11px;
    color: var(--text-dim);
    font-family: 'Share Tech Mono', monospace;
  }

  /* ── Leaflet popup ── */
  .leaflet-popup-content-wrapper {
    background: var(--bg2) !important;
    border: 1px solid var(--border) !important;
    border-radius: 6px !important;
    color: var(--text) !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.5) !important;
  }

  .leaflet-popup-tip { background: var(--bg2) !important; }

  .popup-title {
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 4px;
    color: var(--accent);
  }

  .popup-summary {
    font-size: 11px;
    color: var(--text-dim);
    line-height: 1.5;
    margin-top: 4px;
  }

  .popup-link {
    display: inline-block;
    margin-top: 6px;
    font-size: 10px;
    color: var(--accent2);
  }

  /* ── Ollama status bar ── */
  #ollama-bar {
    background: var(--bg3);
    border-top: 1px solid var(--border);
    padding: 5px 16px;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 10px;
    color: var(--text-dim);
    flex-shrink: 0;
  }

  #ollama-indicator {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--text-dim);
  }

  #ollama-indicator.online { background: var(--accent2); box-shadow: 0 0 6px var(--accent2); }
  #ollama-indicator.offline { background: var(--red); }

  /* ── Empty state ── */
  #empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 8px;
    color: var(--text-dim);
    text-align: center;
    padding: 20px;
  }

  #empty-state .icon { font-size: 32px; opacity: 0.4; }
  #empty-state p { font-size: 11px; line-height: 1.6; }

  @media (max-width: 640px) {
    #sidebar { display: none; }
    .cat-filters { display: none; }
  }
</style>
</head>
<body>

<!-- Toolbar -->
<div id="toolbar">
  <div class="logo">台灣事件地圖</div>
  <div class="toolbar-divider"></div>

  <select id="county-filter">
    <option value="">全部縣市</option>
    <option>台北市</option><option>新北市</option><option>桃園市</option>
    <option>台中市</option><option>台南市</option><option>高雄市</option>
    <option>基隆市</option><option>新竹市</option><option>新竹縣</option>
    <option>苗栗縣</option><option>彰化縣</option><option>南投縣</option>
    <option>雲林縣</option><option>嘉義市</option><option>嘉義縣</option>
    <option>屏東縣</option><option>宜蘭縣</option><option>花蓮縣</option>
    <option>台東縣</option><option>澎湖縣</option><option>金門縣</option>
    <option>連江縣</option>
  </select>

  <div class="cat-filters">
    <span class="cat-tag active" data-cat="災害">災害</span>
    <span class="cat-tag active" data-cat="政治">政治</span>
    <span class="cat-tag active" data-cat="社會">社會</span>
    <span class="cat-tag active" data-cat="經濟">經濟</span>
    <span class="cat-tag active" data-cat="交通">交通</span>
    <span class="cat-tag active" data-cat="其他">其他</span>
  </div>

  <div class="toolbar-right">
    <span id="status-text">等待載入</span>
    <button id="refresh-btn" onclick="loadNews()">↻ 更新</button>
  </div>
</div>

<!-- Main -->
<div id="main">
  <div id="map"></div>
  <div id="sidebar">
    <div id="sidebar-header">LIVE FEED — 近3天事件</div>
    <div id="stats">
      <div class="stat-item">
        <span class="stat-num" id="stat-total">0</span>
        <div class="stat-label">總事件數</div>
      </div>
      <div class="stat-item cat cat-災害">
        <span class="stat-num" id="stat-災害">0</span>
        <div class="stat-label">災害</div>
      </div>
      <div class="stat-item cat cat-社會">
        <span class="stat-num" id="stat-社會">0</span>
        <div class="stat-label">社會</div>
      </div>
      <div class="stat-item cat cat-交通">
        <span class="stat-num" id="stat-交通">0</span>
        <div class="stat-label">交通</div>
      </div>
      <div class="stat-item cat cat-政治">
        <span class="stat-num" id="stat-政治">0</span>
        <div class="stat-label">政治</div>
      </div>
      <div class="stat-item cat cat-經濟">
        <span class="stat-num" id="stat-經濟">0</span>
        <div class="stat-label">經濟</div>
      </div>
    </div>
    <div id="news-list">
      <div id="empty-state">
        <div class="icon">📡</div>
        <p>按「更新」按鈕<br>載入最新新聞</p>
      </div>
    </div>
  </div>
</div>

<!-- Ollama status bar -->
<div id="ollama-bar">
  <div id="ollama-indicator"></div>
  <span id="ollama-status">檢查 Ollama 連線中...</span>
  <span style="margin-left:auto">MODEL: gemma4:e4b &nbsp;|&nbsp; OLLAMA: 11434 (直連)</span>
</div>

<!-- Loading overlay -->
<div id="loading-overlay">
  <div class="loading-spinner"></div>
  <div id="loading-msg">載入新聞中</div>
  <div id="loading-progress"></div>
</div>

<script>
// ── 設定 ──
const OLLAMA_MODEL = 'gemma4:e4b';
const OLLAMA_BASE = 'http://localhost:11434';

// RSS
const RSS_FEEDS = [
  { url: 'https://www.cna.com.tw/rss/aall.aspx',       source: '中央社' },
  { url: 'https://news.ltn.com.tw/rss/all.xml',         source: '自由時報' },
  { url: 'https://udn.com/rssfeed/news/2/0?ch=news',    source: '聯合新聞網' },
];
const CORS_PROXY = 'https://api.allorigins.win/get?url=';
const UPDATE_INTERVAL = 30 * 60 * 1000; // 30分鐘

// 縣市座標表
const COUNTY_COORDS = {
  '台北市': [25.0330, 121.5654], '臺北市': [25.0330, 121.5654],
  '新北市': [25.0169, 121.4627], '桃園市': [24.9936, 121.3010],
  '台中市': [24.1477, 120.6736], '臺中市': [24.1477, 120.6736],
  '台南市': [22.9999, 120.2269], '臺南市': [22.9999, 120.2269],
  '高雄市': [22.6273, 120.3014], '基隆市': [25.1276, 121.7392],
  '新竹市': [24.8138, 120.9675], '新竹縣': [24.6951, 121.1368],
  '苗栗縣': [24.5602, 120.8214], '彰化縣': [23.9936, 120.4818],
  '南投縣': [23.9610, 120.9718], '雲林縣': [23.7224, 120.4313],
  '嘉義市': [23.4801, 120.4491], '嘉義縣': [23.4518, 120.2554],
  '屏東縣': [22.5519, 120.5487], '宜蘭縣': [24.6917, 121.7383],
  '花蓮縣': [23.9871, 121.6015], '台東縣': [22.7583, 121.1444],
  '臺東縣': [22.7583, 121.1444], '澎湖縣': [23.5711, 119.5793],
  '金門縣': [24.4493, 118.3767], '連江縣': [26.1972, 119.9401],
};

// ── 狀態 ──
let allNews = [];
let markers = [];
let activeCategories = new Set(['災害','政治','社會','經濟','交通','其他']);
let map, markerLayer;

// ── 初始化地圖 ──
function initMap() {
  map = L.map('map', {
    center: [23.97, 120.97],
    zoom: 8,
    zoomControl: true,
  });

  L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(map);

  markerLayer = L.layerGroup().addTo(map);
}

// ── 檢查 Ollama（直連）──
async function checkOllama() {
  try {
    const r = await fetch(`${OLLAMA_BASE}/api/tags`, { signal: AbortSignal.timeout(5000) });
    if (r.ok) {
      document.getElementById('ollama-indicator').className = 'online';
      document.getElementById('ollama-status').textContent = 'Ollama 已連線';
      return true;
    }
  } catch {}
  document.getElementById('ollama-indicator').className = 'offline';
  document.getElementById('ollama-status').textContent = 'Ollama 未連線 — 請執行: ollama serve';
  return false;
}

// ── 直接抓 RSS 新聞（不需 Flask）──
async function fetchAllNews() {
  const allItems = [];
  for (const feed of RSS_FEEDS) {
    try {
      const proxyUrl = CORS_PROXY + encodeURIComponent(feed.url);
      const r = await fetch(proxyUrl, { signal: AbortSignal.timeout(15000) });
      if (!r.ok) continue;
      const data = await r.json();
      const parser = new DOMParser();
      const xml = parser.parseFromString(data.contents, 'text/xml');
      const items = xml.querySelectorAll('item');
      items.forEach(item => {
        const title = item.querySelector('title')?.textContent?.trim() || '';
        const desc  = item.querySelector('description')?.textContent?.replace(/<[^>]+>/g, '').trim() || '';
        const link  = item.querySelector('link')?.textContent?.trim() || '';
        const pub   = item.querySelector('pubDate')?.textContent || '';
        if (title) allItems.push({
          title, desc, link,
          source: feed.source,
          date: pub ? new Date(pub) : new Date(),
        });
      });
    } catch (e) {
      console.warn(`RSS fail (${feed.source}):`, e.message);
    }
  }
  return allItems.slice(0, 60);
}

// ── 呼叫 Ollama 分析新聞 ──
async function analyzeWithOllama(newsItems) {
  const batchSize = 5;
  const results = [];

  for (let i = 0; i < newsItems.length; i += batchSize) {
    const batch = newsItems.slice(i, i + batchSize);
    updateLoadingProgress(`分析中 ${Math.min(i + batchSize, newsItems.length)} / ${newsItems.length}`);

    const newsText = batch.map((n, idx) =>
      `${idx + 1}. 標題：${n.title}\n   摘要：${n.desc?.substring(0, 100) || ''}`
    ).join('\n\n');

    const coordsHint = Object.entries(COUNTY_COORDS)
      .filter(([k]) => !k.startsWith('臺'))
      .map(([k,v]) => `${k}:[${v[0]},${v[1]}]`).join(' ');

    const prompt = `你是台灣新聞地理分析師。分析以下${batch.length}則新聞，回傳JSON陣列。

縣市座標參考：${coordsHint}

每則新聞回傳：
{"title":"標題","location":"台灣縣市或鄉鎮，找不到填null","lat":緯度或null,"lng":經度或null,"category":"災害|政治|社會|經濟|交通|其他","summary":"30字內摘要","url":"原始連結"}

新聞：
${newsText}

只回傳JSON陣列，不要其他文字：`;

    try {
      const r = await fetch(`${OLLAMA_BASE}/api/generate`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ model: OLLAMA_MODEL, prompt, stream: false }),
        signal: AbortSignal.timeout(120000)
      });
      const data = await r.json();
      let raw = data.response?.trim() || '';

      // 清理 markdown code block
      raw = raw.replace(/```json\s*/gi, '').replace(/```\s*/g, '').trim();

      // 找 JSON 陣列
      const match = raw.match(/\[[\s\S]*\]/);
      if (match) {
        const parsed = JSON.parse(match[0]);
        parsed.forEach((item, idx) => {
          if (item.lat && item.lng) {
            results.push({
              ...item,
              url: item.url || batch[idx]?.link || '',
              source: batch[idx]?.source || '',
              date: batch[idx]?.date || new Date(),
            });
          }
        });
      }
    } catch (e) {
      console.warn('Ollama 分析失敗:', e.message);
      // fallback: 用縣市關鍵字比對
      batch.forEach(n => {
        for (const [county, coords] of Object.entries(COUNTY_COORDS)) {
          if (n.title.includes(county) || n.desc?.includes(county)) {
            results.push({
              title: n.title,
              location: county,
              lat: coords[0] + (Math.random()-0.5)*0.05,
              lng: coords[1] + (Math.random()-0.5)*0.05,
              category: '其他',
              summary: n.desc?.substring(0, 50) || n.title,
              url: n.link,
              source: n.source,
              date: n.date,
            });
            break;
          }
        }
      });
    }
  }
  return results;
}

// ── 更新地圖 ──
function updateMap() {
  markerLayer.clearLayers();
  markers = [];

  const countyFilter = document.getElementById('county-filter').value;

  // 依地點群組
  const groups = {};
  allNews.forEach(item => {
    if (!activeCategories.has(item.category)) return;
    if (countyFilter && !item.location?.includes(countyFilter)) return;
    const key = `${item.lat?.toFixed(2)}_${item.lng?.toFixed(2)}`;
    if (!groups[key]) groups[key] = { lat: item.lat, lng: item.lng, items: [] };
    groups[key].items.push(item);
  });

  const catColors = {
    '災害': '#ff4466', '政治': '#aa66ff', '社會': '#00aaff',
    '經濟': '#ffcc00', '交通': '#ff8844', '其他': '#5a7a9a'
  };

  Object.values(groups).forEach(group => {
    const count = group.items.length;
    const radius = Math.min(8 + count * 3, 28);
    const mainCat = group.items[0].category;
    const color = catColors[mainCat] || '#5a7a9a';

    const circle = L.circleMarker([group.lat, group.lng], {
      radius,
      fillColor: color,
      color: color,
      weight: 1.5,
      opacity: 0.9,
      fillOpacity: 0.35,
    });

    const popupContent = group.items.slice(0, 5).map(item => `
      <div style="margin-bottom:8px;padding-bottom:8px;border-bottom:1px solid #1e2d45">
        <div class="popup-title">${item.title}</div>
        <div class="popup-summary">${item.summary || ''}</div>
        ${item.url ? `<a class="popup-link" href="${item.url}" target="_blank">閱讀全文 →</a>` : ''}
      </div>
    `).join('');

    circle.bindPopup(`
      <div style="min-width:220px;max-width:280px">
        <div style="font-family:'Share Tech Mono',monospace;font-size:10px;color:#5a7a9a;margin-bottom:8px">
          📍 ${group.items[0].location || '未知'} — ${count} 則事件
        </div>
        ${popupContent}
      </div>
    `, { maxWidth: 300 });

    circle.addTo(markerLayer);
    markers.push(circle);
  });

  updateStats();
  updateNewsList();
}

// ── 更新統計 ──
function updateStats() {
  const cats = ['災害','政治','社會','經濟','交通','其他'];
  const countyFilter = document.getElementById('county-filter').value;
  let total = 0;
  cats.forEach(cat => {
    const count = allNews.filter(n =>
      n.category === cat &&
      (!countyFilter || n.location?.includes(countyFilter))
    ).length;
    const el = document.getElementById(`stat-${cat}`);
    if (el) el.textContent = count;
    total += count;
  });
  document.getElementById('stat-total').textContent = total;
}

// ── 更新新聞列表 ──
function updateNewsList() {
  const list = document.getElementById('news-list');
  const countyFilter = document.getElementById('county-filter').value;
  const filtered = allNews.filter(n =>
    activeCategories.has(n.category) &&
    (!countyFilter || n.location?.includes(countyFilter))
  );

  if (filtered.length === 0) {
    list.innerHTML = `<div id="empty-state"><div class="icon">🔍</div><p>沒有符合條件的事件</p></div>`;
    return;
  }

  list.innerHTML = filtered.slice(0, 60).map(item => `
    <div class="news-item cat-${item.category}" onclick="this.classList.toggle('expanded')">
      <div class="news-title">${item.title}</div>
      <div class="news-meta">
        <span class="news-loc">📍 ${item.location || '未知'}</span>
        <span class="news-cat-badge badge-${item.category}">${item.category}</span>
        <span class="news-loc">${item.source || ''}</span>
      </div>
      <div class="news-summary">
        ${item.summary || ''}
        ${item.url ? `<br><a class="news-link" href="${item.url}" target="_blank">閱讀全文 →</a>` : ''}
      </div>
    </div>
  `).join('');
}

// ── UI 狀態 ──
function setStatus(msg, type = '') {
  const el = document.getElementById('status-text');
  el.textContent = msg;
  el.className = type;
}

function showLoading(show, msg = '') {
  const el = document.getElementById('loading-overlay');
  el.classList.toggle('show', show);
  if (msg) document.getElementById('loading-msg').textContent = msg;
}

function updateLoadingProgress(text) {
  document.getElementById('loading-progress').textContent = text;
}

// ── 主要載入流程 ──
async function loadNews() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  showLoading(true, '連線 Ollama 中...');
  setStatus('連線中...', 'loading');

  const ollamaOk = await checkOllama();
  if (!ollamaOk) {
    showLoading(false);
    setStatus('Ollama 未連線', 'error');
    btn.disabled = false;
    alert('請先確認 Ollama 正在執行：\n\n終端機執行：ollama serve\n然後重新整理');
    return;
  }

  showLoading(true, '抓取 RSS 新聞中...');
  setStatus('抓取新聞...', 'loading');
  updateLoadingProgress('連線 RSS 來源...');

  const rawNews = await fetchAllNews();

  if (rawNews.length === 0) {
    showLoading(false);
    setStatus('新聞抓取失敗', 'error');
    btn.disabled = false;
    alert('請先確認 Flask 後端正在執行：\n\n終端機執行：python3 server.py\n然後重新整理');
    return;
  }

  showLoading(true, `Gemma 分析 ${rawNews.length} 則新聞...`);
  setStatus(`分析 ${rawNews.length} 則新聞...`, 'loading');

  allNews = await analyzeWithOllama(rawNews);

  showLoading(false);

  const now = new Date().toLocaleTimeString('zh-TW');
  setStatus(`更新完成 ${now} — ${allNews.length} 則`, 'ok');

  updateMap();
  btn.disabled = false;

  // 自動更新
  setTimeout(loadNews, UPDATE_INTERVAL);
}

// ── 篩選事件 ──
document.querySelectorAll('.cat-tag').forEach(tag => {
  tag.addEventListener('click', () => {
    const cat = tag.dataset.cat;
    tag.classList.toggle('active');
    if (activeCategories.has(cat)) activeCategories.delete(cat);
    else activeCategories.add(cat);
    updateMap();
  });
});

document.getElementById('county-filter').addEventListener('change', updateMap);

// ── 啟動 ──
initMap();
checkOllama();
</script>
